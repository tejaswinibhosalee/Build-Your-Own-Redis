name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (Java 21 + React)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Builds the React dashboard, compiles Java, runs every test, packages the jar.
      - name: Build and test
        run: mvn -B verify

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Fail the build if any frontend dependency has a known high/critical vulnerability.
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t mini-redis:ci .
